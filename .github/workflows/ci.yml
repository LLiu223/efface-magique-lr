name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Lua 5.1 and Qt offscreen system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          command -v lua >/dev/null || sudo ln -s "$(command -v lua5.1)" /usr/local/bin/lua
          # Fail here rather than let the Lua JsonUtil test silently skip.
          lua -v

      # No simple-lama-inpainting: real LaMa tests skip and no model weights are downloaded.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "PyQt6>=6.5.0" "opencv-python-headless>=4.8.0" "Pillow>=10,<13" "numpy>=1.24.0"
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest tests -q -rs
